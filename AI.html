<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çok Kategorili Bilgi Yarışması</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #12121c;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        .top-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 520px;
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        /* Silindir Toggle Tasarımı */
        .switch {
            position: relative;
            display: inline-block;
            width: 90px;
            height: 40px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #2b2b40;
            transition: .3s;
            border-radius: 34px;
            border: 2px solid #4da6ff;
        }

        .slider:before {
            position: absolute;
            content: "TR";
            height: 32px;
            width: 42px;
            left: 3px;
            bottom: 2px;
            background-color: #4da6ff;
            color: #12121c;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: .3s;
            border-radius: 30px;
        }

        input:checked + .slider {
            background-color: #2b2b40;
        }

        input:checked + .slider:before {
            transform: translateX(40px);
            content: "RU";
            background-color: #ff4d4d;
            color: white;
        }

        .category-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            width: 100%;
        }

        .cat-btn {
            background: #1e1e2f;
            color: #4da6ff;
            border: 2px solid #3f3f5f;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: 0.2s;
            text-align: center;
        }

        .cat-btn:hover, .cat-btn.active {
            background: #4da6ff;
            color: #12121c;
            border-color: #4da6ff;
        }

        .quiz-container {
            width: 100%;
            max-width: 520px;
            background: #1e1e2f;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            padding: 25px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: #4da6ff;
            margin-top: 0;
            font-size: 18px;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 14px;
            color: #ffcc00;
        }

        .question-box {
            font-size: 16px;
            margin-bottom: 20px;
            font-weight: bold;
            min-height: 50px;
            line-height: 1.4;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: #2b2b40;
            color: white;
            border: 2px solid #3f3f5f;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            text-align: left;
            transition: 0.2s;
        }

        .option-btn:hover {
            background: #4da6ff;
            border-color: #4da6ff;
            color: #12121c;
            font-weight: bold;
        }

        .status-msg {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="controls-row">
            <div id="activeCatIndicator" style="font-size: 13px; font-weight: bold; color: #ffcc00;">Kategori: Genel Kültür</div>
            <label class="switch">
                <input type="checkbox" id="langToggle" onchange="dilDegistir()">
                <span class="slider"></span>
            </label>
        </div>

        <div class="category-container">
            <button class="cat-btn active" id="btnGenel" onclick="kategoriDegistir('genel')">🌍 Genel Kültür (100)</button>
            <button class="cat-btn" id="btnAnimasyon" onclick="kategoriDegistir('animasyon')">🎬 Animasyon/DreamW. (100)</button>
            <button class="cat-btn" id="btnFilm" onclick="kategoriDegistir('film')">🍿 Popüler Filmler (100)</button>
            <button class="cat-btn" id="btnKisisel" onclick="kategoriDegistir('kisisel')">💻 Teknoloji & Sen (100)</button>
        </div>
    </div>

    <div class="quiz-container" id="mainContainer">
        <h2 id="mainTitle">Genel Kültür Havuzu</h2>
        <div class="info-bar">
            <span id="livesDisplay">❤️ Can: 3 / 3</span>
            <span id="levelDisplay">Soru: 1 / 10</span>
        </div>
        <div id="questionBox" class="question-box">Soru yükleniyor...</div>
        <div class="options-container" id="optionsContainer"></div>
        <div id="statusMsg" class="status-msg"></div>
    </div>

    <!-- Soruları içeren harici dosya bağlantısı -->
    <script src="sorular.js"></script>

    <script>
        const arayuzMetinleri = {
            tr: {
                can: "❤️ Can: ",
                soruSayac: "Soru: ",
                dogruMsg: "Doğru! Sonraki soruya geçiliyor...",
                yanlisMsg: "Yanlış! Can gitti. Havuzdan yeni soru seçiliyor...",
                kazandinBaslik: "Tebrikler! 🎉",
                kazandinText: "Bu kategorideki soruları başarıyla tamamladın!",
                tekrarOyna: "Tekrar Oyna",
                kilitBaslik: "OYUN KİLİTLENDİ! 🔒",
                kilitText: "Tüm canların bitti! 1 dakika ceza süresi başladı.",
                saniyeText: " saniye",
                kategoriler: {
                    genel: "Genel Kültür (Dağlar, Yemekler, Tarih)",
                    animasyon: "Animasyon & DreamWorks Karakterleri",
                    film: "Popüler Filmler ve Detayları",
                    kisisel: "Teknoloji, Donanım & Sen"
                }
            },
            ru: {
                can: "❤️ Жизни: ",
                soruSayac: "Вопрос: ",
                dogruMsg: "Верно! Переход к следующему вопросу...",
                yanlisMsg: "Неверно! Жизнь потеряна. Новый вопрос...",
                kazandinBaslik: "Поздравления! 🎉",
                kazandinText: "Вы успешно прошли эту категорию!",
                tekrarOyna: "Играть снова",
                kilitBaslik: "ИГРА ЗАБЛОКИРОВАНА! 🔒",
                kilitText: "Все жизни потрачены! Штраф: 1 минута.",
                saniyeText: " секунд",
                kategoriler: {
                    genel: "Общая культура (Горы, Еда, История)",
                    animasyon: "Анимация и персонажи DreamWorks",
                    film: "Популярные фильмы и детали",
                    kisisel: "Технологии, железо и Вы"
                }
            }
        };

        let aktifKategori = "genel";
        let secilenDil = "tr";
        let aktifSorular = [];
        let mevcutSoruIndex = 0;
        let can = 3;
        const toplamCan = 3;

        function kategoriDegistir(kategoriKodu) {
            aktifKategori = kategoriKodu;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            if(kategoriKodu === 'genel') document.getElementById('btnGenel').classList.add('active');
            if(kategoriKodu === 'animasyon') document.getElementById('btnAnimasyon').classList.add('active');
            if(kategoriKodu === 'film') document.getElementById('btnFilm').classList.add('active');
            if(kategoriKodu === 'kisisel') document.getElementById('btnKisisel').classList.add('active');

            can = 3;
            oyunuBaslat();
        }

        function dilDegistir() {
            const toggle = document.getElementById("langToggle");
            secilenDil = toggle.checked ? "ru" : "tr";
            oyunuBaslat();
        }

        function oyunuBaslat() {
            const metinler = arayuzMetinleri[secilenDil];
            document.getElementById("mainTitle").textContent = metinler.kategoriler[aktifKategori];
            document.getElementById("activeCatIndicator").textContent = "Kategori: " + metinler.kategoriler[aktifKategori];
            
            yeniOyunSorulariSec();
            soruGetir();
        }

        function yeniOyunSorulariSec() {
            let havuz = tumKategoriler[aktifKategori][secilenDil];
            let karisik = [...havuz].sort(() => Math.random() - 0.5);
            aktifSorular = karisik.slice(0, 10);
            mevcutSoruIndex = 0;
        }

        function guncelleEkran() {
            const metinler = arayuzMetinleri[secilenDil];
            document.getElementById("livesDisplay").textContent = `${metinler.can}${can} / ${toplamCan}`;
            document.getElementById("levelDisplay").textContent = `${metinler.soruSayac}${mevcutSoruIndex + 1} / 10`;
        }

        function soruGetir() {
            guncelleEkran();
            const qBox = document.getElementById("questionBox");
            const oContainer = document.getElementById("optionsContainer");
            const sMsg = document.getElementById("statusMsg");

            sMsg.textContent = "";
            oContainer.innerHTML = "";
            const aktifSoru = aktifSorular[mevcutSoruIndex];
            qBox.textContent = `${mevcutSoruIndex + 1}. ${aktifSoru.soru}`;

            aktifSoru.secenekler.forEach((secenek, index) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.textContent = secenek;
                btn.onclick = () => cevapKontrol(index, aktifSoru.dogru);
                oContainer.appendChild(btn);
            });
        }

        function cevapKontrol(secilen, dogru) {
            const sMsg = document.getElementById("statusMsg");
            const metinler = arayuzMetinleri[secilenDil];

            if (secilen === dogru) {
                mevcutSoruIndex++;
                if (mevcutSoruIndex < 10) {
                    sMsg.style.color = "#28a745";
                    sMsg.textContent = metinler.dogruMsg;
                    setTimeout(soruGetir, 800);
                } else {
                    document.getElementById("mainContainer").innerHTML = `
                        <h2>${metinler.kazandinBaslik}</h2>
                        <p style="text-align:center; font-size:18px;">${metinler.kazandinText}</p>
                        <button class="option-btn" style="text-align:center; margin-top:20px; width:100%;" onclick="oyunuYenidenBaslat()">${metinler.tekrarOyna}</button>
                    `;
                }
            } else {
                can--;
                if (can > 0) {
                    sMsg.style.color = "#dc3545";
                    sMsg.textContent = metinler.yanlisMsg;
                    setTimeout(() => {
                        yeniOyunSorulariSec();
                        soruGetir();
                    }, 1500);
                } else {
                    cezayiBaslat(60);
                }
            }
        }

        function cezayiBaslat(saniye) {
            const container = document.getElementById("mainContainer");
            const metinler = arayuzMetinleri[secilenDil];
            let kalanSure = saniye;

            container.innerHTML = `
                <h2 style="color: #ff4d4d;">${metinler.kilitBaslik}</h2>
                <p style="text-align:center; font-size:16px;">${metinler.kilitText}</p>
                <div id="timerBox" style="text-align:center; font-size:32px; font-weight:bold; color:#ffcc00; margin: 30px 0;">
                    ${kalanSure}${metinler.saniyeText}
                </div>
            `;

            const sayacInterval = setInterval(() => {
                kalanSure--;
                document.getElementById("timerBox").textContent = `${kalanSure}${metinler.saniyeText}`;

                if (kalanSure <= 0) {
                    clearInterval(sayacInterval);
                    oyunuYenidenBaslat();
                }
            }, 1000);
        }

        function oyunuYenidenBaslat() {
            can = 3;
            document.getElementById("mainContainer").innerHTML = `
                <h2 id="mainTitle"></h2>
                <div class="info-bar">
                    <span id="livesDisplay"></span>
                    <span id="levelDisplay"></span>
                </div>
                <div id="questionBox" class="question-box"></div>
                <div class="options-container" id="optionsContainer"></div>
                <div id="statusMsg" class="status-msg"></div>
            `;
            oyunuBaslat();
        }

        oyunuBaslat();
    </script>
</body>
</html>
